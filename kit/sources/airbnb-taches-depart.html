<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.ck{position:relative;background:#fff;border:2px solid #E3E0DA;border-radius:44px;padding:48px 52px 16px;margin-top:56px}
.pin{position:absolute;left:50%;top:-22px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--dark);box-shadow:0 0 0 10px var(--canvas)}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd b{font-family:var(--font-title);font-weight:700;font-size:48px}
.pill{background:var(--dark);color:#fff;border-radius:40px;padding:14px 34px;font-weight:600;font-size:26px;letter-spacing:.14em}
.sec{font-weight:600;font-size:23px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-3);margin:26px 0 4px}
.r{display:flex;align-items:center;gap:26px;padding:13px 0;border-bottom:2px dashed #E3E0DA;font-size:33px}
.r:last-child{border-bottom:0}
.r svg{width:36px;height:36px;flex:none}
.no{color:var(--fg-3);text-decoration:line-through}
.no svg{color:#B8B8B0}
.ok{font-weight:600;color:var(--fg-1)}
.ok svg{color:var(--lime-muted)}
</style></head><body>
<section class="slide light">
  <div class="label"><span class="rule"></span>Airbnb</div>
  <h1 style="margin-top:40px;font-size:80px">La liste de départ<br><em>raccourcit.</em></h1>
  <div class="ck"><div class="pin"></div>
    <div class="hd"><b>Avant de partir</b><span class="pill">DÈS LE 20.11</span></div>
    <div class="sec">Ne peut plus être exigé</div>
    <div class="r no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg> Faire et ranger la vaisselle</div>
    <div class="r no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg> Défaire les lits, lancer une lessive</div>
    <div class="r no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg> Sortir les poubelles</div>
    <div class="sec">Reste possible</div>
    <div class="r ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg> Mettre la vaisselle dans l'évier</div>
    <div class="r ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg> Rassembler les serviettes</div>
    <div class="r ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg> Trier les déchets</div>
  </div>
  <div class="footer"><div><img class="logo logo-dark" src="logo/rield-logo-inverse.png" alt="Rield"><img class="logo logo-light" src="logo/rield-logo-couleur.png" alt="Rield"></div><div class="src" style="font-size:24px">Source : Airbnb, 20/10/2026</div></div>
</section>
</body></html>
